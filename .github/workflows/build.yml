name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Başarısız testleri annotation olarak yaz (log indirmeden PR/çalışma sayfasında görünsün).
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $msg = ($_.Output.ErrorInfo.Message + ' | ' + $_.Output.ErrorInfo.StackTrace) -replace "`r?`n", ' '
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }

      - name: Publish (tek exe, win-x64)
        run: dotnet publish src/KilitBul/KilitBul.csproj -c Release -r win-x64 -o dist

      - name: Kurulum dosyası (NSIS)
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $candidate)) { choco install nsis -y --no-progress | Out-Null }
            $makensis = $candidate
          }
          $version = ([xml](Get-Content src/KilitBul/KilitBul.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $makensis "-DVERSION=$version" installer/KilitBul.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: KilitBul-win-x64
          path: |
            dist/KilitBul.exe
            dist/KilitBul-Setup-*.exe
